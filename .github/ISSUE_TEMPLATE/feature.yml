name: Task / Feature
description: A unit of work from the plan
labels: ['type:feat']
body:
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What should exist when this is done?
    validations:
      required: true

  - type: textarea
    id: done
    attributes:
      label: Definition of done
      description: Checklist a reviewer can verify.
      value: |
        - [ ]
        - [ ]
    validations:
      required: true

  - type: input
    id: files
    attributes:
      label: Files likely touched
      placeholder: src/lib/quiz/kana.ts, src/lib/quiz/kana.spec.ts

  - type: dropdown
    id: lane
    attributes:
      label: Lane
      options:
        - engine
        - play
        - typing
        - order
        - score
        - admin
        - content
        - shared
    validations:
      required: true

  - type: input
    id: blocked
    attributes:
      label: Blocked by
      placeholder: '#12'
