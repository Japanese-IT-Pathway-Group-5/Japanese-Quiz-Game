name: Deploy

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: write

jobs:
  production:
    name: Deploy to production
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # worker-configuration.d.ts is generated, not committed — see .gitignore.
      - name: Generate Cloudflare types
        run: pnpm run gen

      - name: Build
        run: pnpm run build

      # Migrations run BEFORE deploy, always. Shipping new code against an old
      # schema is the classic self-inflicted outage.
      # Self-activates once the first Drizzle migration lands in drizzle/ (M2).
      - name: Apply D1 migrations (remote)
        if: hashFiles('drizzle/**') != ''
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          packageManager: pnpm
          command: d1 migrations apply japanese-quiz --remote

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          packageManager: pnpm
          command: deploy

  preview:
    name: Upload PR preview
    # Forks cannot read repo secrets, so this job is skipped for them by design.
    # All six of us push branches to this repo directly, so it applies to our PRs.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # worker-configuration.d.ts is generated, not committed — see .gitignore.
      - name: Generate Cloudflare types
        run: pnpm run gen

      - name: Build
        run: pnpm run build

      - name: Upload preview version
        id: upload
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          packageManager: pnpm
          command: versions upload --preview-alias pr-${{ github.event.number }}

      - name: Comment preview URL on the PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMAND_OUTPUT: ${{ steps.upload.outputs.command-output }}
        run: |
          URL=$(printf '%s' "$COMMAND_OUTPUT" | grep -oE 'https://[a-zA-Z0-9._-]+\.workers\.dev' | tail -n 1)
          if [ -z "$URL" ]; then
            echo "No preview URL found in wrangler output; skipping comment."
            exit 0
          fi
          gh pr comment "${{ github.event.number }}" \
            --edit-last --create-if-none \
            --body "🔎 **Preview for this PR:** $URL

          Updated on every push to this branch."
